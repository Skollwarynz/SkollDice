name: Build Android Only

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Build Android APK
        run: |
          # 1. Clona SDL2 ufficiale
          git clone -b SDL2 --depth 1 https://github.com/libsdl-org/SDL.git sdl-source
          
          # 2. Copia la struttura base di Android
          cp -r sdl-source/android-project ./android
          
          # 3. Copia i sorgenti di SDL2 dentro jni/SDL
          mkdir -p android/app/jni/SDL
          cp -r sdl-source/include android/app/jni/SDL/
          cp -r sdl-source/src android/app/jni/SDL/
          
          # Alias SDL2/SDL.h per soddisfare #include <SDL2/SDL.h>
          mkdir -p android/app/jni/SDL/include/SDL2
          cp -r sdl-source/include/* android/app/jni/SDL/include/SDL2/
          
          # Pulisci la repository temporanea di SDL
          rm -rf sdl-source
          
          # 4. Configurazione delle cartelle sorgente e dipendenze
          mkdir -p android/app/jni/src
          mkdir -p android/app/jni/include
          
          if [ -d "src" ]; then
            cp -r src/* android/app/jni/src/
          fi
          if [ -d "include" ]; then
            cp -r include/* android/app/jni/include/
          fi
          
          if [ -d "dependencies" ]; then
            cp -r dependencies/* android/app/jni/
          fi
          
          # RIMUOVIAMO l'header msinttypes problematico di Visual Studio/ThorVG per Android
          rm -rf android/app/jni/**/msinttypes/stdint.h
          
          # 5. Scrive un Android.mk pulito
          cd android
          
          cat << 'EOF' > app/jni/Android.mk
          LOCAL_PATH := $(call my-dir)

          # --- Compilazione di SDL2 come libreria statica ---
          include $(CLEAR_VARS)
          LOCAL_MODULE := SDL2
          
          SDL_PATH := SDL
          LOCAL_C_INCLUDES := $(LOCAL_PATH)/$(SDL_PATH)/include
          
          LOCAL_SRC_FILES := \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/atomic/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/audio/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/audio/android/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/core/android/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/cpuinfo/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/dynapi/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/events/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/file/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/haptic/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/hidapi/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/joystick/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/joystick/android/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/loadso/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/locale/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/misc/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/power/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/filesystem/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/render/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/render/opengles/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/sensor/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/stdlib/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/thread/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/thread/pthread/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/timer/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/timer/unix/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/video/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/video/android/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/main/android/*.c))

          LOCAL_CFLAGS := -DGL_GLEXT_PROTOTYPES=1 -DUSE_GLES1=0
          include $(BUILD_STATIC_LIBRARY)

          # --- Compilazione del gioco e delle dipendenze (LVGL) come libreria dinamica ---
          include $(CLEAR_VARS)
          LOCAL_MODULE := main
          
          game_files := $(shell find $(LOCAL_PATH)/src -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.cc" \))
          dep_files  := $(shell find $(LOCAL_PATH)/* -maxdepth 2 -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.cc" \) ! -path "$(LOCAL_PATH)/SDL/*" ! -path "$(LOCAL_PATH)/src/*")
          
          LOCAL_SRC_FILES := $(patsubst $(LOCAL_PATH)/%,%,$(game_files) $(dep_files))
          
          all_includes := $(shell find $(LOCAL_PATH) -type d)
          LOCAL_C_INCLUDES := $(LOCAL_PATH)/SDL/include $(all_includes)
          
          LOCAL_CFLAGS := -DGL_GLEXT_PROTOTYPES=1 -DUSE_GLES1=0
          
          LOCAL_STATIC_LIBRARIES := SDL2
          LOCAL_LDLIBS := -lGLESv1_CM -lGLESv2 -llog -landroid
          include $(BUILD_SHARED_LIBRARY)
          EOF

          if [ -f "app/jni/Application.mk" ]; then
            echo "APP_ALLOW_MISSING_DEPS := true" >> app/jni/Application.mk
            echo "APP_ABI := armeabi-v7a arm64-v8a" >> app/jni/Application.mk
            echo "APP_PLATFORM := android-21" >> app/jni/Application.mk
          fi
          
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SkollDice-Android.apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore
