name: Build and Release All

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - run: |
          sudo apt-get install -y build-essential cmake libsdl2-dev
          mkdir build && cd build && cmake .. && make
          mv MiaApp ../SkollDice-Linux
      - uses: actions/upload-artifact@v4
        with: {name: SkollDice-Linux, path: SkollDice-Linux}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - run: |
          brew install sdl2 cmake
          mkdir build && cd build && cmake .. && make
          mv MiaApp ../SkollDice-macOS
      - uses: actions/upload-artifact@v4
        with: {name: SkollDice-macOS, path: SkollDice-macOS}

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - run: |
          sudo apt-get install -y build-essential cmake gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          # (Configura qui il tuo toolchain se necessario)
          mkdir build && cd build && cmake -DCMAKE_TOOLCHAIN_FILE=../cmake/win_toolchain.cmake .. && make
          mv MiaApp.exe ../SkollDice-Windows.exe
      - uses: actions/upload-artifact@v4
        with: {name: SkollDice-Windows.exe, path: SkollDice-Windows.exe}

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SkollDice-Android.apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

  release:
    needs: [build-linux, build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: artifacts}
      
      # Release su GitHub
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Release su Codeberg
      - name: Upload to Codeberg
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # Crea la Release su Codeberg
          curl -X POST "https://codeberg.org/api/v1/repos/Skollwarynz/SkollDice/releases" \
            -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"$TAG\", \"name\": \"Release $TAG\"}"
          
          # Recupera ID
          ID=$(curl -s "https://codeberg.org/api/v1/repos/Skollwarynz/SkollDice/releases/tags/$TAG" \
            -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" | jq .id)
          
          # Carica file uno ad uno
          for f in artifacts/**/*; do
            curl -X POST "https://codeberg.org/api/v1/repos/Skollwarynz/SkollDice/releases/$ID/assets" \
              -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
              -F "attachment=@$f"
          done
