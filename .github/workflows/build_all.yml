name: Build and Release All

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - run: |
          sudo apt-get update && sudo apt-get install -y build-essential cmake libsdl2-dev
          mkdir build && cd build && cmake .. && make
          mv MiaApp ../SkollDice-Linux
      - uses: actions/upload-artifact@v4
        with: {name: SkollDice-Linux, path: SkollDice-Linux}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - run: |
          brew install sdl2 cmake
          mkdir build && cd build && cmake .. && make
          mv MiaApp ../SkollDice-macOS
      - uses: actions/upload-artifact@v4
        with: {name: SkollDice-macOS, path: SkollDice-macOS}

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64-x86-64-dev
          
          curl -O https://www.libsdl.org/release/SDL2-devel-2.30.0-mingw.tar.gz
          tar -xzf SDL2-devel-2.30.0-mingw.tar.gz
          sudo cp -r SDL2-2.30.0/x86_64-w64-mingw32/include/SDL2 /usr/x86_64-w64-mingw32/include/
          sudo cp SDL2-2.30.0/x86_64-w64-mingw32/lib/*.a /usr/x86_64-w64-mingw32/lib/
          
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=../cmake/win_toolchain.cmake ..
          make
          mv MiaApp.exe ../SkollDice-Windows.exe
      - uses: actions/upload-artifact@v4
        with: {name: SkollDice-Windows.exe, path: SkollDice-Windows.exe}

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Build Android APK
        run: |
          if [ ! -d "android" ]; then
            echo "Generazione struttura Android per SDL2..."
            git clone -b SDL2 https://github.com/libsdl-org/SDL.git sdl-temp
            cp -r sdl-temp/android-project ./android
            rm -rf sdl-temp
            
            mkdir -p android/app/jni/src
            cp -r src/* android/app/jni/src/ 2>/dev/null || true
            cp -r include/* android/app/jni/src/ 2>/dev/null || true
          fi
          
          if [ -f "android/app/jni/Android.mk" ]; then
            sed -i 's/SDL3/SDL2/g' android/app/jni/Android.mk || true
          fi
          
          # Forza l'abilitazione delle dipendenze mancanti per evitare il blocco NDK
          if [ -f "android/app/jni/Application.mk" ]; then
            echo "APP_ALLOW_MISSING_DEPS := true" >> android/app/jni/Application.mk
          else
            echo "APP_ALLOW_MISSING_DEPS := true" > android/app/jni/Application.mk
          fi
          
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SkollDice-Android.apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore

  release:
    needs: [build-linux, build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: artifacts}
      
      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Codeberg
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          curl -X POST "https://codeberg.org/api/v1/repos/Skollwarynz/SkollDice/releases" \
            -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"$TAG\", \"name\": \"Release $TAG\"}"
          
          ID=$(curl -s "https://codeberg.org/api/v1/repos/Skollwarynz/SkollDice/releases/tags/$TAG" \
            -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" | jq .id)
          
          for f in artifacts/**/*; do
            curl -X POST "https://codeberg.org/api/v1/repos/Skollwarynz/SkollDice/releases/$ID/assets" \
              -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
              -F "attachment=@$f"
          done
