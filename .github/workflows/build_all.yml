name: Linux Build

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Fix Apt & Install Dependencies
        run: |
          # A volte act ha problemi con le chiavi temporali di apt, forziamo la pulizia
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          
          # Installiamo le dipendenze essenziali
          sudo apt-get update -o Acquire::Check-Valid-Until=false || true
          sudo apt-get install -y cmake build-essential libyaml-cpp-dev

      - name: Build
        run: |
          mkdir build
          cd build
          cmake ..
          make
          make install DESTDIR=AppDir

      - name: Create AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -o appimage
