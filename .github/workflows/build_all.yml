name: Build and Release All

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      
      - name: Install Dependencies & Build
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential cmake libsdl2-dev wget
          mkdir build && cd build
          cmake .. -DLINUX_APPIMAGE=ON
          make -j$(nproc)
          
          # Prepariamo la struttura AppDir per l'AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/share/applications
          
          # Copia dell'eseguibile
          cp SkollDice_bin-linux AppDir/usr/bin/SkollDice
          
          # Copia dell'icona e creazione file .desktop per Linuxdeploy
          cp ../SkollDice/Assets/SkollDice_icon.png AppDir/usr/share/icons/hicolor/256x256/apps/SkollDice.png
          
          cat << EOF > AppDir/usr/share/applications/SkollDice.desktop
          [Desktop Entry]
          Name=SkollDice
          Exec=SkollDice
          Icon=SkollDice
          Type=Application
          Categories=Game;
          EOF

          # Generazione AppImage tramite linuxdeploy
          wget -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          ./linuxdeploy --appdir=AppDir --icon-file=../SkollDice/Assets/SkollDice_icon.png --desktop-file=AppDir/usr/share/applications/SkollDice.desktop --output appimage
          
          mv SkollDice-*.AppImage ../SkollDice-linux.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: SkollDice-Linux
          path: SkollDice-linux.AppImage

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      
      - name: Build macOS
        run: |
          brew install sdl2 cmake
          mkdir build && cd build
          cmake ..
          make -j$(nproc)
          mv SkollDice_bin ../SkollDice-macOS

      - uses: actions/upload-artifact@v4
        with:
          name: SkollDice-macOS
          path: SkollDice-macOS

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      
      - name: Build Windows
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64-x86-64-dev
                    
          curl -O https://www.libsdl.org/release/SDL2-devel-2.30.0-mingw.tar.gz
          tar -xzf SDL2-devel-2.30.0-mingw.tar.gz
          sudo cp -r SDL2-2.30.0/x86_64-w64-mingw32/include/SDL2 /usr/x86_64-w64-mingw32/include/
          sudo cp SDL2-2.30.0/x86_64-w64-mingw32/lib/*.a /usr/x86_64-w64-mingw32/lib/
                    
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=../cmake/win_toolchain.cmake ..
          make -j$(nproc)
          mv SkollDice_bin.exe ../SkollDice-Windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: SkollDice-Windows
          path: SkollDice-Windows.exe

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: artifacts}
            
      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload to Codeberg
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Uploading to Codeberg..."
