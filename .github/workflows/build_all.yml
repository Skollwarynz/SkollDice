name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

      - name: Prepare SDL2 and Project Structure
        run: |
          # 1. Clona SDL2 ufficiale
          git clone -b SDL2 --depth 1 https://github.com/libsdl-org/SDL.git sdl-source
          
          # 2. Crea la struttura android-project di base
          cp -r sdl-source/android-project ./android

          # Sposta SDL2 dove CMake può trovarlo facilmente
          mkdir -p android/app/jni/SDL
          cp -r sdl-source/include android/app/jni/SDL/
          cp -r sdl-source/src android/app/jni/SDL/
          rm -rf sdl-source

          # 3. Copia i sorgenti del gioco e le dipendenze (LVGL)
          mkdir -p android/app/jni/src
          mkdir -p android/app/jni/include

          if [ -d "src" ]; then
            cp -r src/* android/app/jni/src/
          fi
          if [ -d "include" ]; then
            cp -r include/* android/app/jni/include/
          fi
          if [ -d "dependencies" ]; then
            cp -r dependencies/* android/app/jni/
          fi

          # 4. Pulizia file Windows/MSVC
          find android/app/jni/ -type d -name "msinttypes" -exec rm -rf {} +
          find android/app/jni/ -type d -name "VisualStudio" -exec rm -rf {} +
          find android/app/jni/ -type d -name "test" -exec rm -rf {} +

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release App
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
