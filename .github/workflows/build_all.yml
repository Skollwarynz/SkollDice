- name: Prepare SDL2 and Android Structure
        run: |
          # 1. Clona SDL2 ufficiale
          git clone -b SDL2 --depth 1 https://github.com/libsdl-org/SDL.git sdl-source
          
          # 2. Crea la struttura android-project di base
          cp -r sdl-source/android-project ./android

          mkdir -p android/app/jni/SDL
          cp -r sdl-source/include android/app/jni/SDL/
          cp -r sdl-source/src android/app/jni/SDL/

          mkdir -p android/app/jni/SDL/include/SDL2
          cp -r sdl-source/include/* android/app/jni/SDL/include/SDL2/
          rm -rf sdl-source

          # 3. Copia i sorgenti del gioco e le dipendenze (LVGL)
          mkdir -p android/app/jni/src
          mkdir -p android/app/jni/include

          if [ -d "src" ]; then
            cp -r src/* android/app/jni/src/
          fi
          if [ -d "include" ]; then
            cp -r include/* android/app/jni/include/
          fi
          if [ -d "dependencies" ]; then
            cp -r dependencies/* android/app/jni/
          fi

          # PULIZIA CRITICA: Rimuove file Windows/MSVC e test da LVGL che fanno fallire Clang
          find android/app/jni/ -type d -name "msinttypes" -exec rm -rf {} +
          find android/app/jni/ -type d -name "VisualStudio" -exec rm -rf {} +
          find android/app/jni/ -type d -name "test" -exec rm -rf {} +
          find android/app/jni/ -type f -name "*.vcxproj" -delete
          find android/app/jni/ -type f -name "*.sln" -delete
