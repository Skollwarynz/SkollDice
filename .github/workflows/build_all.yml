name: Build and Release All

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - run: |
          sudo apt-get update && sudo apt-get install -y build-essential cmake libsdl2-dev
          mkdir build && cd build && cmake .. && make
          mv MiaApp ../SkollDice-Linux
      - uses: actions/upload-artifact@v4
        with: {name: SkollDice-Linux, path: SkollDice-Linux}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - run: |
          brew install sdl2 cmake
          mkdir build && cd build && cmake .. && make
          mv MiaApp ../SkollDice-macOS
      - uses: actions/upload-artifact@v4
        with: {name: SkollDice-macOS, path: SkollDice-macOS}

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64-x86-64-dev
          
          curl -O https://www.libsdl.org/release/SDL2-devel-2.30.0-mingw.tar.gz
          tar -xzf SDL2-devel-2.30.0-mingw.tar.gz
          sudo cp -r SDL2-2.30.0/x86_64-w64-mingw32/include/SDL2 /usr/x86_64-w64-mingw32/include/
          sudo cp SDL2-2.30.0/x86_64-w64-mingw32/lib/*.a /usr/x86_64-w64-mingw32/lib/
          
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=../cmake/win_toolchain.cmake ..
          make
          mv MiaApp.exe ../SkollDice-Windows.exe
      - uses: actions/upload-artifact@v4
        with: {name: SkollDice-Windows.exe, path: SkollDice-Windows.exe}

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Build Android APK
        run: |
          # 1. Clona SDL2 ufficiale per prendere sia android-project che i sorgenti nativi
          git clone -b SDL2 --depth 1 https://github.com/libsdl-org/SDL.git sdl-source
          
          # 2. Copia la struttura base di Android
          cp -r sdl-source/android-project ./android
          
          # 3. Copia i sorgenti di SDL2 dentro jni/SDL
          mkdir -p android/app/jni/SDL
          cp -r sdl-source/include android/app/jni/SDL/
          cp -r sdl-source/src android/app/jni/SDL/
          
          # Pulisci la repository temporanea di SDL
          rm -rf sdl-source
          
          # 4. Assicura che i sorgenti del gioco siano collegati correttamente ad Android
          mkdir -p android/app/jni/src
          if [ -d "src" ]; then
            cp -r src/* android/app/jni/src/
          fi
          if [ -d "include" ]; then
            cp -r include/* android/app/jni/src/
          fi
          
          # 5. Scrive un Android.mk robusto che include anche i sorgenti Android specifici di SDL
          cd android
          
          cat << 'EOF' > app/jni/Android.mk
          LOCAL_PATH := $(call my-dir)

          # --- Compilazione di SDL2 come libreria statica ---
          include $(CLEAR_VARS)
          LOCAL_MODULE := SDL2
          
          SDL_PATH := SDL
          LOCAL_C_INCLUDES := $(LOCAL_PATH)/$(SDL_PATH)/include
          
          # Prende tutti i sorgenti C di SDL2, inclusi quelli della sottocartella android/ e core/
          LOCAL_SRC_FILES := \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/atomic/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/audio/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/audio/android/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/core/android/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/cpuinfo/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/dynapi/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/events/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/file/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/haptic/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/hidapi/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/joystick/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/joystick/android/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/loadso/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/locale/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/misc/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/power/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/filesystem/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/render/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/render/opengles/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/sensor/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/stdlib/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/thread/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/thread/pthread/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/timer/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/timer/unix/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/video/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/video/android/*.c)) \
              $(subst $(LOCAL_PATH)/,,$(wildcard $(LOCAL_PATH)/$(SDL_PATH)/src/main/android/*.c))

          LOCAL_CFLAGS := -DGL_GLEXT_PROTOTYPES=1 -DUSE_GLES1=0
          LOCAL_LDLIBS := -lGLESv1_CM -lGLESv2 -llog -landroid
          include $(BUILD_STATIC_LIBRARY)

          # --- Compilazione del gioco (main) come libreria dinamica ---
          include $(CLEAR_VARS)
          LOCAL_MODULE := main
          
          game_files := $(wildcard $(LOCAL_PATH)/src/*.c $(LOCAL_PATH)/src/*.cpp $(LOCAL_PATH)/src/*.cc)
          LOCAL_SRC_FILES := $(patsubst $(LOCAL_PATH)/%,%,$(game_files))
          
          LOCAL_C_INCLUDES := $(LOCAL_PATH)/SDL/include
          LOCAL_STATIC_LIBRARIES := SDL2
          LOCAL_LDLIBS := -lGLESv1_CM -lGLESv2 -llog -landroid -latomic
          include $(BUILD_SHARED_LIBRARY)
          EOF

          if [ -f "app/jni/Application.mk" ]; then
            echo "APP_ALLOW_MISSING_DEPS := true" >> app/jni/Application.mk
            echo "APP_ABI := armeabi-v7a arm64-v8a" >> app/jni/Application.mk
            echo "APP_PLATFORM := android-21" >> app/jni/Application.mk
          fi
          
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SkollDice-Android.apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore

  release:
    needs: [build-linux, build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: artifacts}
      
      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Codeberg
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          curl -X POST "https://codeberg.org/api/v1/repos/Skollwarynz/SkollDice/releases" \
            -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"$TAG\", \"name\": \"Release $TAG\"}"
          
          ID=$(curl -s "https://codeberg.org/api/v1/repos/Skollwarynz/SkollDice/releases/tags/$TAG" \
            -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" | jq .id)
          
          for f in artifacts/**/*; do
            curl -X POST "https://codeberg.org/api/v1/repos/Skollwarynz/SkollDice/releases/$ID/assets" \
              -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
              -F "attachment=@$f"
          done
