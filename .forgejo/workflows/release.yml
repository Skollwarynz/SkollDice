name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: docker
    container:
      image: gcc:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y cmake libsdl2-dev

      - name: Build
        run: |
          mkdir build_linux && cd build_linux
          cmake ..
          cmake --build . --config Release

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: MiaApp-Linux
          path: build_linux/MiaApp

  build-windows:
    runs-on: docker
    container:
      image: debian:bookworm-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y cmake mingw-w64 libsdl2-dev

      - name: Build Windows Executable
        run: |
          mkdir build_win && cd build_win
          cmake -DCMAKE_TOOLCHAIN_FILE=../cmake/win_toolchain.cmake ..
          cmake --build .
          mv MiaApp.exe MiaApp-Windows.exe

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: MiaApp-Windows
          path: build_win/MiaApp-Windows.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: MiaApp-Linux
          path: ./release_files/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: MiaApp-Windows
          path: ./release_files/

      - name: Create Forgejo Release
        uses: gitea/action-release-notes@v1
        env:
          GITHUB_TOKEN: ${{ secrets.codeberg_token }}
        with:
          files: ./release_files/*
